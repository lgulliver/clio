services:
  postgres:
    image: postgres:17-alpine@sha256:979c4379dd698aba0b890599a6104e082035f98ef31d9b9291ec22f2b13059ca
    environment:
      # Fictional local development credentials only. Never reuse for hosting.
      POSTGRES_USER: clio_dev
      POSTGRES_PASSWORD: clio_dev_password
      POSTGRES_DB: clio_dev
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - clio_postgres_dev:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U clio_dev -d clio_dev"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  clio_postgres_dev:
