name: Clio CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine@sha256:979c4379dd698aba0b890599a6104e082035f98ef31d9b9291ec22f2b13059ca
        env:
          POSTGRES_USER: clio_test
          POSTGRES_PASSWORD: clio_test
          POSTGRES_DB: clio_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U clio_test -d clio_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - name: Check PostgreSQL persistence
        run: pnpm --filter @clio/api test:integration
        env:
          CLIO_TEST_DATABASE_URL: postgres://clio_test:clio_test@127.0.0.1:5432/clio_test
      - name: Check generated routes and whitespace
        run: |
          git diff --exit-code
          git diff --check
      - uses: actions/upload-artifact@v7
        with:
          name: clio-web
          path: apps/web/dist
          if-no-files-found: error
